<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolProp R134a Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    button { padding: 12px; margin-top: 12px; }
    #result { padding: 12px; background: #eef3fa; margin-top: 15px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Refrigerant Cycle Pro</h1>
  <h2>CoolProp R134a Test</h2>
  <p id="loading">Loading CoolProp...</p>
  <button id="test" disabled>Calculate R134a enthalpy</button>
  <div id="result">Waiting for engine...</div>
<h3>R134a Pressure–Enthalpy Chart</h3>
<svg id="phChart" viewBox="0 0 700 430"
     style="width:100%;background:#f5f8fc;border:1px solid #ccc;border-radius:8px;">
</svg>
  <script type="module">
  import createCoolProp from "./coolprop.js";

  let Module;

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const button = document.getElementById("test");

  try {
    Module = await createCoolProp({
      locateFile: (path) =>
        path.endsWith(".wasm") ? "./coolprop.wasm" : path
    });

    loading.textContent = "CoolProp loaded successfully.";
    button.disabled = false;

    // Make the initialized engine available to the test button.
    window.coolpropModule = Module;
  } catch (error) {
    loading.textContent = "CoolProp failed to load.";
    result.textContent = String(error);
    console.error(error);
  }
</script>  <script>
    document.getElementById("test").addEventListener("click", function() {
      try {
        // 5 bar absolute, 20 degrees Celsius
        var pressurePa = 800000;
        var temperatureK = 303.15;

        var h = window.coolpropModule.PropsSI(
          "H", "P", pressurePa, "T", temperatureK, "R134a"
        );var hLiquid = window.coolpropModule.PropsSI(
  "H", "P", pressurePa, "Q", 0, "R134a"
);var hVapour = window.coolpropModule.PropsSI(
  "H", "P", pressurePa, "Q", 1, "R134a"
);var saturationPressuresBar = [2, 4, 6, 8, 10, 12, 14];
        var hSuction = window.coolpropModule.PropsSI(
  "H", "P", 200000, "T", 273.15, "R134a"
);
        console.log("Compressor suction enthalpy:", (hSuction / 1000).toFixed(2), "kJ/kg");
        var hDischarge = window.coolpropModule.PropsSI(
  "H", "P", 1200000, "T", 348.15, "R134a"
);
        var hCondenser = window.coolpropModule.PropsSI(
  "H", "P", 1200000, "T", 303.15, "R134a"
);
        var hExpansion = hCondenser;
        console.log("Condenser outlet enthalpy:", (hCondenser / 1000).toFixed(2), "kJ/kg");
        console.log("Compressor discharge enthalpy:", (hDischarge / 1000).toFixed(2), "kJ/kg");

var saturationData = saturationPressuresBar.map(function(bar) {
  var p = bar * 100000;

  var liquid = window.coolpropModule.PropsSI(
    "H", "P", p, "Q", 0, "R134a"
  );

  var vapour = window.coolpropModule.PropsSI(
    "H", "P", p, "Q", 1, "R134a"
  );

  return {
    pressureBar: bar,
    liquidKJ: liquid / 1000,
    vapourKJ: vapour / 1000
  };
});

        if (!Number.isFinite(h) || h <= 0) {
          throw new Error("Invalid enthalpy returned: " + h);
        }

        document.getElementById("result").textContent =
          "Refrigerant: R134a\n" +
          "Pressure: 8 bar absolute\n" +
          "Temperature: 30 °C\n" +
          "Enthalpy: " + (h / 1000).toFixed(2) + " kJ/kg\n" +
"Saturated liquid: " + (hLiquid / 1000).toFixed(2) + " kJ/kg\n" +
"Saturated vapour: " + (hVapour / 1000).toFixed(2) + " kJ/kg"+
"\n\nR134a SATURATION DATA\n" +
"Pressure | Liquid | Vapour\n" +
saturationData.map(function(point) {
  return point.pressureBar + " bar | " +
    point.liquidKJ.toFixed(2) + " | " +
    point.vapourKJ.toFixed(2) + " kJ/kg";
}).join("\n");
        
const chart = document.getElementById("phChart");
const liquidPoints = saturationData.map(p => ({
  x: 55 + (p.liquidKJ - 150) * 0.85,
  y: 380 - (Math.log(p.pressureBar / 2) / Math.log(14 / 2)) * 300
}));
const vapourPoints = saturationData.map(p => ({
  x: 55 + (p.vapourKJ - 150) * 0.85,
  y: 380 - (Math.log(p.pressureBar / 2) / Math.log(14 / 2)) * 300
}));

const makePath = points =>
  points.map((p, i) =>
    (i === 0 ? "M" : "L") + p.x + "," + p.y
  ).join(" ");

chart.innerHTML = `
<line
  x1="${55 + ((hSuction / 1000) - 150) * 0.85}"
  y1="${380 - (2 - 2) * 25}"
  x2="${55 + ((hDischarge / 1000) - 150) * 0.85}"
  y2="${380 - (12 - 2) * 25}"
  stroke="red"
  stroke-width="2"
  stroke-dasharray="6,4"
/>
<line
  x1="${55 + ((hDischarge / 1000) - 150) * 0.85}"
  y1="${380 - (12 - 2) * 25}"
  x2="${55 + ((hCondenser / 1000) - 150) * 0.85}"
  y2="${380 - (12 - 2) * 25}"
  stroke="green"
  stroke-width="2"
  stroke-dasharray="6,4"
/>
  <path d="${makePath(liquidPoints)}"
        fill="none" stroke="blue" stroke-width="3"/>
  <path d="${makePath(vapourPoints)}"
        fill="none" stroke="orange" stroke-width="3"/>
         ${[2, 4, 6, 8, 10, 12, 14].map(p => {
    const y = 380 - (p - 2) * 25;
    return `
      <line x1="45" y1="${y}" x2="300" y2="${y}"
            stroke="#d1d5db" stroke-width="1"/>
      <text x="38" y="${y + 4}" text-anchor="end"
            font-size="12" fill="#374151">${p}</text>
    `;
  }).join("")}
    ${[150, 200, 250, 300, 350, 400, 450, 500].map(h => {
    const x = 55 + (h - 150) * 0.85;
    return `
      <line x1="${x}" y1="80" x2="${x}" y2="380"
            stroke="#d1d5db" stroke-width="1"/>
      <text x="${x}" y="397" text-anchor="middle"
            font-size="11" fill="#374151">${h}</text>
    `;
  }).join("")}
  <text x="190" y="415" font-size="14">Enthalpy (kJ/kg)</text>
  <text x="15" y="215" font-size="14"
        transform="rotate(-90 15 215)">Pressure (bar)</text>
        <circle
  cx="${55 + ((hSuction / 1000) - 150) * 0.85}"
 cy="${380 - (2 - 2) * 25}"
  r="6"
  fill="red"
  stroke="white"
  stroke-width="2"
  data-point="Compressor suction"
/>
<circle
  cx="${55 + ((hDischarge / 1000) - 150) * 0.85}"
  cy="${380 - (12 - 2) * 25}"
  r="6"
  fill="orange"
  stroke="white"
  stroke-width="2"
  data-point="Compressor discharge"
/>
<circle
  cx="${55 + ((hCondenser / 1000) - 150) * 0.85}"
  cy="${380 - (12 - 2) * 25}"
  r="6"
  fill="limegreen"
  stroke="white"
  stroke-width="2"
  data-point="Condenser outlet"
/>
<circle
  cx="${55 + ((hExpansion / 1000) - 150) * 0.85}"
  cy="${380 - (2 - 2) * 25}"
  r="6"
  fill="purple"
  stroke="white"
  stroke-width="2"
  data-point="Expansion valve outlet"
/>
`;
      } catch (error) {
        document.getElementById("result").textContent =
          "Calculation error: " + error.message;
      }
    });
  </script>
</body>
</html>
